name: Build

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        # Daily rebuild to pick up Wolfi package and toolchain fixes.
        - cron: "0 7 * * *"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    id-token: write # for keyless signing with cosign
    packages: write

jobs:
    build:
        uses: pdeslaur/oci-common/.github/workflows/build.yaml@main
        with:
            publish: ${{ github.event_name != 'pull_request' }}
